<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo Halloween - Extasis</title>
    <!-- Fuentes Google: Pirata One y MedievalSharp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="xat-space-escenario">
        
        <!-- Destellos de Tormenta / Relámpagos -->
        <div class="capa-relampago"></div>

        <!-- Luna de Halloween con Cara Maquiavélica de Jack Skellington -->
        <div class="luna-halloween">
            <svg class="cara-jack-maquiavelica" viewBox="0 0 200 200">
                <!-- Sombra de cuencas hundidas -->
                <path class="sombra-ojo" d="M 38,106 C 30,80 50,55 78,64 C 98,70 102,96 90,118 C 78,135 48,124 38,106 Z" />
                <path class="sombra-ojo" d="M 162,106 C 170,80 150,55 122,64 C 102,70 98,96 110,118 C 122,135 152,124 162,106 Z" />

                <!-- Ojo izquierdo: Ceño fruncido agresivo y angular -->
                <path class="rasgo-jack" d="M 44,104 C 36,86 52,65 76,71 C 94,76 96,96 88,114 C 78,128 52,120 44,104 Z" />
                <!-- Ceja izquierda marcada hacia abajo -->
                <path class="ceja-maquiavelica" d="M 40,78 Q 70,68 96,90" />

                <!-- Ojo derecho: Ceño fruncido agresivo y angular -->
                <path class="rasgo-jack" d="M 156,104 C 164,86 148,65 124,71 C 106,76 104,96 112,114 C 122,128 148,120 156,104 Z" />
                <!-- Ceja derecha marcada hacia abajo -->
                <path class="ceja-maquiavelica" d="M 160,78 Q 130,68 104,90" />

                <!-- Arruga siniestra en el entrecejo -->
                <path class="arruga-entrecejo" d="M 97,94 Q 100,80 98,73" />
                <path class="arruga-entrecejo" d="M 103,94 Q 100,80 102,73" />

                <!-- Fosas nasales esqueléticas inclinadas -->
                <ellipse class="rasgo-jack" cx="93" cy="132" rx="3" ry="6.5" transform="rotate(-24 93 132)" />
                <ellipse class="rasgo-jack" cx="107" cy="132" rx="3" ry="6.5" transform="rotate(24 107 132)" />

                <!-- Sonrisa maquiavélica arqueada con comisuras afiladas hacia arriba -->
                <path class="costura-boca" d="M 28,138 Q 42,160 100,166 Q 158,160 172,138" />

                <!-- Costuras / Dientes cosidos verticales e irregulares -->
                <line class="puntada" x1="36" y1="139" x2="38" y2="152" />
                <line class="puntada" x1="50" y1="148" x2="51" y2="162" />
                <line class="puntada" x1="66" y1="154" x2="67" y2="170" />
                <line class="puntada" x1="82" y1="158" x2="82" y2="175" />
                <line class="puntada" x1="100" y1="159" x2="100" y2="176" />
                <line class="puntada" x1="118" y1="158" x2="118" y2="175" />
                <line class="puntada" x1="134" y1="154" x2="133" y2="170" />
                <line class="puntada" x1="150" y1="148" x2="149" y2="162" />
                <line class="puntada" x1="164" y1="139" x2="162" y2="152" />
            </svg>
        </div>

        <!-- Silueta de Lápidas y Cementerio -->
        <div class="cementerio-silueta">
            <div class="lapida l1"></div>
            <div class="lapida l2 cruz"></div>
            <div class="lapida l3"></div>
            <div class="lapida l4 cruz"></div>
            <div class="lapida l5"></div>
        </div>

        <!-- Niebla en Capas -->
        <div class="niebla-densa niebla-capa1"></div>
        <div class="niebla-densa niebla-capa2"></div>

        <!-- Hojas de otoño que se queman y emiten humo -->
        <div class="contenedor-hojas">
            <div class="hoja-contenedor c1">
                <div class="hoja"></div>
                <div class="humo-ceniza"></div>
            </div>
            <div class="hoja-contenedor c2">
                <div class="hoja"></div>
                <div class="humo-ceniza"></div>
            </div>
            <div class="hoja-contenedor c3">
                <div class="hoja"></div>
                <div class="humo-ceniza"></div>
            </div>
            <div class="hoja-contenedor c4">
                <div class="hoja"></div>
                <div class="humo-ceniza"></div>
            </div>
            <div class="hoja-contenedor c5">
                <div class="hoja"></div>
                <div class="humo-ceniza"></div>
            </div>
            <div class="hoja-contenedor c6">
                <div class="hoja"></div>
                <div class="humo-ceniza"></div>
            </div>
        </div>

        <!-- Capa de Textos ajustada a xat.com -->
        <div class="xat-capa-textos">
            <!-- Título superior: EXTASIS nítido y legible en trasfondo -->
            <h1 class="texto-extasis">EXTASIS</h1>

            <!-- Saludo inferior: Ubicado en la barra de abajo -->
            <h2 class="texto-feliz-halloween">Feliz Halloween</h2>
        </div>

    </div>

</body>
</html>
